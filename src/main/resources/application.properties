# Configuración para producción (Render) - usa variables de entorno
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/cafeteriadb;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}

# Dialecto automático
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2 (solo para desarrollo local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=true
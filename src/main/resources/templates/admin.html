<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Casita de Chocolate</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 style="color: #4A148C;"><i class="fas fa-crown"></i> Panel de Administración</h2>
        <div>
            <a href="/" class="btn btn-outline-secondary">Ver Catálogo</a>
            <a href="/logout" class="btn btn-outline-danger">Cerrar Sesión</a>
        </div>
    </div>

    <a href="/admin/nuevo" class="btn btn-primary mb-3">
        <i class="fas fa-plus-circle"></i> Agregar Producto
    </a>

    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead style="background-color: #D1C4E9; color: #4A148C;">
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Vendidos</th>
                    <th>Disponible</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${productos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="'$' + ${p.precio}"></td>
                    <td th:text="${p.descripcion}"></td>
                    <td th:text="${p.cantidad}"></td>
                    <td th:text="${p.vendidos}"></td>
                    <td>
                        <span th:if="${p.disponible}" class="badge badge-success">✅ Disponible</span>
                        <span th:unless="${p.disponible}" class="badge badge-danger">❌ No disponible</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/editar/{id}(id=${p.id})}" class="btn btn-sm btn-warning">✏️ Editar</a>
                        <a th:href="@{/admin/eliminar/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar este producto?')">🗑️</a>
                        <form th:action="@{/admin/vender/{id}(id=${p.id})}" method="post" style="display:inline-block;">
                            <input type="number" name="cantidad" value="1" min="1" max="1000" style="width:60px;" required>
                            <button type="submit" class="btn btn-sm btn-success">Vender</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(productos)}" class="text-center">
        <p>No hay productos registrados.</p>
    </div>
</div>
</body>
</html>

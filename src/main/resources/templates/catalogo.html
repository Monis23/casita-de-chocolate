<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Casita de Chocolate</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container my-4">
    <!-- Encabezado -->
    <div class="text-center mb-4">
        <img th:src="@{/images/casitadechocolate.png}" style="height:80px;" onerror="this.style.display='none'">
        <h1 style="color: #4A148C;">🍫 Casita de Chocolate</h1>
        <p class="lead">Aseo · Confituras · Comida</p>
        <a href="/login" class="btn btn-outline-primary" style="border-color: #D1C4E9; color: #4A148C;">
            <i class="fas fa-lock"></i> Administración
        </a>
    </div>

    <!-- Productos -->
    <div class="row">
        <div th:each="p : ${productos}" class="col-md-4 mb-4">
            <div class="card h-100" style="border: 2px solid #F8BBD0; border-radius: 15px;">
                <img th:if="${p.fotoUrl != null and !p.fotoUrl.isEmpty()}"
                     th:src="${p.fotoUrl}" class="card-img-top" alt="Foto"
                     style="height:200px; object-fit:cover; border-radius: 15px 15px 0 0;">
                <div th:unless="${p.fotoUrl != null and !p.fotoUrl.isEmpty()}"
                     class="card-img-top" style="height:200px; background:#f8f9fa; display:flex; align-items:center; justify-content:center; color:#ccc;">
                    <i class="fas fa-image" style="font-size:3rem;"></i>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.nombre}">Nombre</h5>
                    <p class="card-text" th:text="'$' + ${p.precio}">Precio</p>
                    <p class="card-text" th:text="${p.descripcion}">Descripción</p>
                    <span class="badge badge-success" style="background-color: #81C784;">✅ Disponible</span>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(productos)}" class="col-12 text-center">
            <p>No hay productos disponibles en este momento.</p>
        </div>
    </div>
</div>
</body>
</html>

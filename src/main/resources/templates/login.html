<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Casita de Chocolate</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #F8BBD0 0%, #D1C4E9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 30px;
            padding: 40px 35px;
            box-shadow: 0 15px 35px rgba(74, 20, 140, 0.2);
            max-width: 420px;
            width: 100%;
            border: 2px solid #F8BBD0;
            transition: transform 0.3s;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        .login-card h2 {
            color: #4A148C;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .login-card .subtitle {
            color: #7E57C2;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .login-card .logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        .login-card .form-group label {
            color: #4A148C;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .login-card .form-control {
            border-radius: 50px;
            border: 2px solid #D1C4E9;
            padding: 12px 20px;
            transition: all 0.3s;
        }
        .login-card .form-control:focus {
            border-color: #B39DDB;
            box-shadow: 0 0 0 0.2rem rgba(179, 157, 219, 0.3);
        }
        .login-card .btn-login {
            background: #D1C4E9;
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 700;
            color: #4A148C;
            width: 100%;
            transition: all 0.3s;
            font-size: 1.1rem;
        }
        .login-card .btn-login:hover {
            background: #B39DDB;
            color: white;
            transform: scale(1.02);
        }
        .login-card .error-msg {
            color: #E53935;
            background: #FFEBEE;
            padding: 10px;
            border-radius: 50px;
            font-size: 0.9rem;
            margin-top: 15px;
        }
        .login-card .footer-text {
            margin-top: 20px;
            color: #7E57C2;
            font-size: 0.85rem;
        }
        .login-card .footer-text i {
            color: #F8BBD0;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <img th:src="@{/images/casitadechocolate.png}" alt="Logo" class="logo-img" onerror="this.style.display='none'">
            <h2>Casita de Chocolate</h2>
            <p class="subtitle">Panel de Administración</p>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username"><i class="fas fa-user"></i> Usuario</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
            </div>
            <div class="form-group">
                <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </button>
        </form>

        <div th:if="${param.error}" class="error-msg text-center">
            <i class="fas fa-exclamation-circle"></i> Usuario o contraseña incorrectos.
        </div>

        <div class="footer-text text-center">
            <i class="fas fa-heart"></i> Acceso restringido al personal autorizado
        </div>
    </div>
</body>
</html>
